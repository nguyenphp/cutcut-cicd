name: Deploy to TestFlight (Public Builder)

on:
  workflow_dispatch: # Bấm Run workflow trên GitHub — người bấm lấy tự động từ github.actor
    inputs:
      committer_name:
        description: 'Tên người kích hoạt build'
        required: false
        default: ''
      platform:
        description: 'Build nền tảng nào'
        required: false
        default: 'all'
        type: choice
        options: [all, ios, android, metadata]
  push:
    tags:
      - 'v*' # Tự động chạy khi bạn push tag dạng v1.0.0, v1.0.1...

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TELEGRAM_TOPIC_ID: 2 # Gửi tin nhắn vào Topic ID = 2
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GROQ_MODEL: llama-3.3-70b-versatile

jobs:
  deploy:
    name: Build & Deploy iOS App
    runs-on: macos-latest # Chạy trên macOS runner của GitHub (chứa sẵn Xcode 26 / iOS 26 SDK)
    # Chạy khi: push tag (không có input), hoặc dispatch với platform = all/ios.
    # Bỏ qua khi dispatch chỉ định android -> khỏi đốt macOS minutes.
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'ios'

    steps:
      # 1. Capture thời gian bắt đầu
      - name: Capture Job Start Time
        run: echo "JOB_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      # 2. Checkout mã nguồn từ repo Private (full history + tags để tạo changelog)
      - name: Checkout Private Source Code
        uses: actions/checkout@v4
        with:
          repository: nguyenphp/vibecut # Đường dẫn repo Private chứa code iOS của bạn
          token: ${{ secrets.PRIVATE_REPO_PAT }} # Personal Access Token để tải repo Private
          path: source # Tải source code vào thư mục con 'source'
          fetch-depth: 0 # Lấy TOÀN BỘ history + tag để gom commit kể từ tag gần nhất

      # 3. Lấy người kích hoạt build + gom commit kể từ tag gần nhất
      - name: Get Build Information
        id: info
        run: |
          # Người bấm build / push tag: lấy từ input hoặc tự động từ GitHub
          BUILDER="${{ github.event.inputs.committer_name }}"
          if [ -z "$BUILDER" ]; then
            BUILDER="${{ github.actor }}"
          fi
          if [ "$BUILDER" = "nguyenphp" ]; then
            BUILDER="Nguyên Phạm - Percy"
          fi
          echo "builder=$BUILDER" >> $GITHUB_OUTPUT

          # Lấy marketing version từ project settings
          VERSION=$(grep -m 1 "MARKETING_VERSION" source/ios/VibeCut/VibeCut.xcodeproj/project.pbxproj | awk -F'= ' '{print $2}' | tr -d ';[:space:]"')
          if [ -z "$VERSION" ]; then
            VERSION="1.0"
          fi
          echo "app_version=$VERSION" >> $GITHUB_OUTPUT

          cd source
          # Xác định khoảng commit kể từ tag gần nhất
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            CURRENT="${{ github.ref_name }}"
            PREV=$(git describe --tags --abbrev=0 "${CURRENT}^" 2>/dev/null || echo "")
            if [[ -n "$PREV" ]]; then RANGE="$PREV..$CURRENT"; else RANGE="$CURRENT"; fi
            COMMITS_ALL=$(git log $RANGE --no-merges --pretty=format:"- %s" 2>/dev/null || echo "")
          else
            PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [[ -n "$PREV" ]]; then
              RANGE="$PREV..HEAD"
              COMMITS_ALL=$(git log $RANGE --no-merges --pretty=format:"- %s" 2>/dev/null || echo "")
            else
              RANGE="HEAD (top 15 commits)"
              COMMITS_ALL=$(git log -n 15 --no-merges --pretty=format:"- %s" 2>/dev/null || echo "")
            fi
          fi
          echo "📌 Range: $RANGE (prev tag: ${PREV:-none})"

          if [[ -z "$COMMITS_ALL" ]]; then COMMITS_ALL="- Cập nhật hệ thống."; fi
          COUNT=$(printf '%s\n' "$COMMITS_ALL" | grep -c '^- ' || echo 0)
          COMMITS=$(printf '%s\n' "$COMMITS_ALL" | head -n 30)

          echo "prev_tag=${PREV:-}" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          {
            echo "commits<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # 4. Nhờ Groq tổng hợp release notes + đặt tên build (mood)
      - name: Generate Release Notes & Mood (Groq)
        id: notes
        env:
          COMMITS: ${{ steps.info.outputs.commits }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          call_groq() {
            local prompt=$1 payload response
            if [ -z "$GROQ_API_KEY" ]; then
              echo "::warning::GROQ_API_KEY trống, bỏ qua gọi AI." >&2
              return 1
            fi
            payload=$(jq -n --arg m "$GROQ_MODEL" --arg p "$prompt" \
              '{model:$m, messages:[{role:"user",content:$p}], temperature:0.7}')
            response=$(curl -s -X POST "https://api.groq.com/openai/v1/chat/completions" \
              -H "Authorization: Bearer $GROQ_API_KEY" -H "Content-Type: application/json" -d "$payload")
            if echo "$response" | jq -e '.choices[0].message.content' >/dev/null 2>&1; then
              echo "$response" | jq -r '.choices[0].message.content'
            else
              echo "::warning::Groq lỗi: $(echo "$response" | jq -r '.error.message // "unknown"' 2>/dev/null)" >&2
              return 1
            fi
          }

          # Thử gọi Groq sinh Release Notes
          PROMPT="Bạn là AI chuyên nghiệp. Viết bản tóm tắt 'Tính năng mới & Cập nhật' cho bản $REF_NAME của app CutCut (trình chỉnh sửa video iOS) bằng tiếng Việt, ngắn gọn súc tích. Yêu cầu: mỗi dòng bắt đầu bằng dấu gạch (-); KHÔNG hiển thị hoặc đề cập đến bất kỳ mã task nào (như US-1234, US-xxxx); tập trung thay đổi chính; tối đa 6 dòng, mỗi dòng dưới 100 ký tự; không nhắc commit hash hay mã nguồn; không dùng markdown phức tạp.\n\nDanh sách thay đổi:\n$COMMITS"
          NOTES=$(call_groq "$PROMPT" 2>/dev/null) || NOTES=""

          # Fallback trực tiếp từ Git Commits nếu Groq AI không phản hồi:
          if [ -z "$NOTES" ] || [ "$NOTES" = "null" ]; then
            echo "::notice::Groq không khả dụng, lấy trực tiếp git commit history làm release notes..."
            # Lấy trực tiếp danh sách commit thực tế vừa push lên (tối đa 8 commit)
            NOTES=$(echo "$COMMITS" | head -n 8)
            if [ -z "$NOTES" ]; then
              NOTES="- Cập nhật hệ thống và cải tiến hiệu năng."
            fi
          fi
          NOTES=$(echo "$NOTES" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          # Thử gọi Groq sinh Mood
          MOOD_PROMPT="Dựa trên danh sách thay đổi sau, đặt một tên tóm tắt nội dung chính chuyên nghiệp bằng tiếng Việt cho bản build CutCut này kèm emoji phù hợp (VD: 'Nâng cấp Auto Cut & Tối ưu xuất video 🚀'). Chỉ trả về duy nhất cái tên, tối đa 60 ký tự, không kèm mã task.\n\nDanh sách thay đổi:\n$COMMITS"
          MOOD=$(call_groq "$MOOD_PROMPT" 2>/dev/null) || MOOD=""

          # Fallback cho Mood nếu Groq lỗi:
          if [ -z "$MOOD" ] || [ "$MOOD" = "null" ]; then
            FIRST_COMMIT=$(echo "$COMMITS" | head -n 1 | sed -E 's/^-[[:space:]]*(feat|fix|refactor|perf|chore|style|bump)?(\([^\)]+\))?:?[[:space:]]*//' | cut -c 1-50)
            if [ -n "$FIRST_COMMIT" ]; then
              MOOD="Cập nhật: ${FIRST_COMMIT} 🚀"
            else
              MOOD="Cập nhật CutCut 🎬"
            fi
          fi
          MOOD=$(echo "$MOOD" | head -n 1 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          {
            echo "notes<<EOF"; echo "$NOTES"; echo "EOF"
            echo "mood<<EOF"; echo "$MOOD"; echo "EOF"
          } >> $GITHUB_OUTPUT

      # 5. Gửi thông báo bắt đầu build về Telegram Topic 2
      - name: Send Build Started Notification
        env:
          MOOD: ${{ steps.notes.outputs.mood }}
          NOTES: ${{ steps.notes.outputs.notes }}
          BUILDER: ${{ steps.info.outputs.builder }}
          COUNT: ${{ steps.info.outputs.count }}
          REF: ${{ github.ref_name }}
          APP_VERSION: ${{ steps.info.outputs.app_version }}
        run: |
          MSG="🎬 *Bắt đầu build: ${MOOD}*

          🏷️ *Phiên bản:* ${APP_VERSION} (${REF})
          👨‍💻 *Người ấn build:* ${BUILDER}
          📦 *Số commit:* ${COUNT}

          📝 *Có gì mới:*
          ${NOTES}"

          curl -s -X POST https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d message_thread_id="${TELEGRAM_TOPIC_ID}" \
            --data-urlencode text="$MSG" \
            -d parse_mode="Markdown"

      # 6. Cài đặt chứng chỉ Apple Certificate (.p12)
      - name: Install Apple Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Giải mã chứng chỉ .p12 từ secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # Tạo keychain tạm thời
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import chứng chỉ
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      # 7. Cài đặt Provisioning Profile (.mobileprovision)
      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          for profile in source/*.mobileprovision; do
            if [ -f "$profile" ]; then
              UUID=$(security cms -D -i "$profile" | grep -A1 "<key>UUID</key>" | grep "<string>" | sed -E 's/<\/?string>//g' | tr -d '[:space:]')
              echo "Installing profile $profile with UUID: $UUID"
              cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
            fi
          done

      # 8. Cài đặt Ruby và Bundler
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: source/ios/VibeCut

      # 9. Chạy Fastlane để tự động hóa build và upload lên TestFlight
      - name: Build & Push to TestFlight via Fastlane
        id: fastlane
        working-directory: source/ios/VibeCut
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          bundle exec fastlane beta

      # 10. Tính toán kết quả build và dung lượng file .ipa
      - name: Calculate Build Stats
        if: always()
        id: stats
        run: |
          # Tính thời gian chạy
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - JOB_START_TIME))
          MINUTES=$((DURATION / 60))
          SECONDS=$((DURATION % 60))
          echo "duration=${MINUTES}m ${SECONDS}s" >> $GITHUB_OUTPUT

          # Lấy kích thước file .ipa nếu build thành công
          IPA_PATH=$(find source/ios/VibeCut -name "*.ipa" | head -n 1)
          if [ -f "$IPA_PATH" ]; then
            SIZE=$(du -sh "$IPA_PATH" | cut -f1)
            echo "size=$SIZE" >> $GITHUB_OUTPUT
          else
            echo "size=N/A" >> $GITHUB_OUTPUT
          fi

      # 11. Gửi thông báo kết quả cuối cùng về Telegram Topic 2
      - name: Send Telegram Final Notification
        if: always()
        env:
          MOOD: ${{ steps.notes.outputs.mood }}
          NOTES: ${{ steps.notes.outputs.notes }}
          BUILDER: ${{ steps.info.outputs.builder }}
          REF: ${{ github.ref_name }}
          DURATION: ${{ steps.stats.outputs.duration }}
          SIZE: ${{ steps.stats.outputs.size }}
          STATUS: ${{ job.status }}
          APP_VERSION: ${{ steps.fastlane.outputs.app_version }}
          APP_BUILD: ${{ steps.fastlane.outputs.app_build }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Xác định chuỗi phiên bản
          if [ -n "$APP_VERSION" ] && [ -n "$APP_BUILD" ]; then
            VERSION_STR="${APP_VERSION} (${APP_BUILD})"
          else
            # Fallback nếu không lấy được build number từ Fastlane (ví dụ: build lỗi giữa chừng)
            VERSION_STR="${{ steps.info.outputs.app_version }} (${REF})"
          fi

          if [ "$STATUS" = "success" ]; then
            MSG="✅ *Build thành công — hàng đã có trên TestFlight!*

          🎬 *${MOOD}*
          📌 *Phiên bản:* ${VERSION_STR}
          🕐 *Thời gian build:* ${DURATION}
          📦 *Dung lượng:* ${SIZE}
          👨‍💻 *Người kích hoạt:* ${BUILDER}

          📝 *Có gì mới:*
          ${NOTES}

          🎉 Mở TestFlight tải về tận hưởng thôi!"
          else
            MSG="❌ *Build thất bại rồi bạn hiền!*

          ⚠️ Tiến trình đóng gói hoặc tải lên TestFlight đã bị lỗi.
          📌 *Phiên bản:* ${VERSION_STR}
          👨‍💻 *Người kích hoạt:* ${BUILDER}
          🔗 *Xem chi tiết lỗi:* $RUN_URL"
          fi

          curl -s -X POST https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d message_thread_id="${TELEGRAM_TOPIC_ID}" \
            --data-urlencode text="$MSG" \
            -d parse_mode="Markdown"

  # ==========================================================================
  # ANDROID — chạy SONG SONG job iOS. ubuntu-latest rẻ và nhanh hơn macOS nhiều,
  # Android không cần macOS runner.
  # ==========================================================================
  android:
    name: Build & Deploy Android App
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'android'

    steps:
      - name: Capture Job Start Time
        run: echo "JOB_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout Private Source Code
        uses: actions/checkout@v4
        with:
          repository: nguyenphp/vibecut
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: source
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Get Build Information
        id: info
        run: |
          BUILDER="${{ github.event.inputs.committer_name }}"
          if [ -z "$BUILDER" ]; then BUILDER="${{ github.actor }}"; fi
          if [ "$BUILDER" = "nguyenphp" ]; then BUILDER="Nguyên Phạm - Percy"; fi
          echo "builder=$BUILDER" >> $GITHUB_OUTPUT

          # versionName lấy TỪ NGUỒN iOS để 2 app không lệch số, không thêm file version thứ hai.
          VERSION=$(grep -m 1 "MARKETING_VERSION" source/ios/VibeCut/VibeCut.xcodeproj/project.pbxproj \
            | awk -F'= ' '{print $2}' | tr -d ';[:space:]"')
          if [ -z "$VERSION" ]; then VERSION="1.0"; fi
          echo "app_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.jks
          ls -la $RUNNER_TEMP/release.jks

      - name: Build Release APK
        working-directory: source/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease \
            -PversionName="${{ steps.info.outputs.app_version }}" \
            -PversionCode=${{ github.run_number }} \
            -PstoreFile=$RUNNER_TEMP/release.jks \
            -PstorePassword="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PkeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PkeyPassword="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Locate APK
        id: apk
        run: |
          APK=$(find source/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "không tìm thấy APK"; exit 1; fi
          SIZE_MB=$(( $(stat -c%s "$APK") / 1048576 ))
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "size_mb=$SIZE_MB" >> $GITHUB_OUTPUT
          echo "APK: $APK (${SIZE_MB}MB)"

      # Bot Telegram giới hạn 50MB. Vượt thì đẩy artifact + gửi link, đừng để CI
      # xanh mà không ai nhận được file. fromJSON để so SỐ (outputs luôn là string).
      - name: Upload APK as artifact (khi > 50MB)
        if: fromJSON(steps.apk.outputs.size_mb) >= 49
        uses: actions/upload-artifact@v4
        with:
          name: cutcut-android-${{ steps.info.outputs.app_version }}-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}

      - name: Notify Telegram (gửi file APK)
        if: fromJSON(steps.apk.outputs.size_mb) < 49
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START_TIME ))
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "message_thread_id=${TELEGRAM_TOPIC_ID}" \
            -F "document=@${{ steps.apk.outputs.path }}" \
            -F "caption=🤖 CutCut Android ${{ steps.info.outputs.app_version }} (build ${{ github.run_number }}) — ${{ steps.info.outputs.builder }} — ${ELAPSED}s"

      - name: Notify Telegram (gửi link khi APK quá lớn)
        if: fromJSON(steps.apk.outputs.size_mb) >= 49
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d message_thread_id="${TELEGRAM_TOPIC_ID}" \
            --data-urlencode text="🤖 CutCut Android ${{ steps.info.outputs.app_version }} (build ${{ github.run_number }}) — APK ${{ steps.apk.outputs.size_mb }}MB vượt giới hạn Telegram. Tải ở: $RUN_URL"

      - name: Notify Telegram on failure
        if: failure()
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d message_thread_id="${TELEGRAM_TOPIC_ID}" \
            --data-urlencode text="❌ Build Android THẤT BẠI (build ${{ github.run_number }}). Xem: $RUN_URL"

  deploy_metadata:
    name: Upload App Store Metadata Only (What's New & Promo)
    runs-on: macos-latest
    if: github.event.inputs.platform == 'metadata'
    steps:
      - name: Checkout Private Source Code
        uses: actions/checkout@v4
        with:
          repository: nguyenphp/vibecut
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: source
          fetch-depth: 1

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: source/ios/VibeCut

      - name: Fastlane Upload Metadata Only
        working-directory: source/ios/VibeCut
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          bundle exec fastlane metadata

      - name: Notify Telegram Metadata Success
        if: success()
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d message_thread_id="${TELEGRAM_TOPIC_ID}" \
            --data-urlencode text="✅ Đã upload thành công Metadata (What's New & Promotional Text) lên App Store Connect!"
